name: Java CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Run tests
        shell: bash
        run: |
          if [[ -f pom.xml ]]; then
            mvn test --batch-mode
          else
            echo "No Maven project found; repository structure check passed."
          fi
